---
# ⚠️ `restart docker` — тяжёлая операция. Перезапускает docker.service,
# что кратковременно кладёт ВСЕ контейнеры (Matrix, Nextcloud, Element
# Call, всё). Восстановление занимает ~1 минуту. Планируй время.
#
# Если не хочешь чтобы handler автоматически рестартанул docker при
# изменении daemon.json — запускай с `--skip-tags docker-dns` и потом
# `systemctl restart docker` руками в удобное время.

- name: restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart pwrstatd
  ansible.builtin.systemd:
    name: pwrstatd
    state: restarted
